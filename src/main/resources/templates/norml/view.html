<!DOCTYPE html>
<html lang = "en" xmlns:th = "https://www.thymeleaf.org" th:replace = "norml/base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title>View Page</title>
</head>
<body>
	
	<section>
	<div class = "card mr-3 ml-3">
		<div class = "card-body" >
		
	
	
			<h1 class = "text-center">Your Contacts</h1>
			
			<!-- search -->
			<div class = "search-container my-4">
				<input onkeyup = "search()" id = "search-input" type = "text" class = "form-control" placeholder = "Search your contact">
				<div class = "search-result">
				<!-- result -->
				</div>
			</div>
			
			<table class="table">
  <thead>
    <tr>
      <th scope="col">#Id</th>
      <th scope="col">Name</th>
      <th scope="col">Email</th>
      <th scope="col">Phone</th>
        <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each = "c:${contacts}">
      <th scope="row" th:text = "${'SCM2026' + c.cid}">1</th>
      <!-- show image -->
      <td>
      <img src ="" class = "my-profile-picture" th:src = "@{'/img/' + ${c.image}}" alt = "profilephoto">
      <span th:text = "${c.name}">Mark</span>
      </td>
      
      <td>
      <a href = "" th:href = "@{'/user/'+${c.cid}+'/contact'}">
      <span th:text = "${c.email}"></span>
      </a>
      
      </td>
      <td th:text = "${c.phoneno}">@mdo</td>
      <td>
      <!-- call the method which is declare in base.html and use pipe for dynamic value -->
      <a href = "#" th:onClick = "|deletecontact(${c.cid})|" class = "btn btn-danger btn-sm">Delete</a>
      <a th:href = "@{'/user/open-update/' + ${c.cid}}" class = "btn  btn-primary btn-sm">Update</a>
      </td>
    </tr>
 
  
   
    
  </tbody>
</table>
		<!-- pagination part -->
		
		<nav aria-label="Page navigation example">
  <ul class="pagination">
    <li th:if = "${currentPage != 0}" class="page-item"><a class="page-link" th:href = "@{'/user/view-contacts/' + ${currentPage-1}}" 
    href="#">Previous</a></li>
    
    <li th:classAppend = "${currentPage == i-1? 'active' : ''}" th:each = "i : ${#numbers.sequence(1, totalPage)}" 
    class="page-item"><a th:href = "@{'/user/view-contacts/'+${i-1}}" 
    class="page-link" href="#"><span th:text = "${i}"></span></a></li>
   
    <li th:if = "${currentPage+1 != totalPage}" class="page-item"><a class="page-link" th:href = "@{'/user/view-contacts/'+ ${currentPage+1}}" href="#">Next</a></li>
  </ul>
</nav>
		
		</div>
		
		</div>
	
	</div>
	
	
	</section>
</body>
</html>
