<!DOCTYPE html>
<html lang = "en" xmlns:th = "http://www.thymeleaf.org" th:replace = "~{norml/base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
</head>
<body>
	
	<section>
		
	<div class = "container">
		<div class = "row">
			<div class = "col-md-12">
				<div class = "card">
					<div class = "card-body">
						<h1 class = "mb-3">Forgot Password</h1>
						<form action = "" th:action = "@{/user/forgot-password}" method = "post">
						
						
						<div class = "form-group">
							<input name = "email" type = "email" class = "form-control" placeholder = "Enter your username">
						</div>
						
						
						<div class = "container text-center">
						<button type = "submit" class = "btn btn-success">Send OTP</button>
						</div>
						</form>
					
					</div>
				
				</div>
			
			
			</div>
		
		</div>
	
	</div>
	
	</section>
</body>
</html>
