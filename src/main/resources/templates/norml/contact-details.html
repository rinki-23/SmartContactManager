<!DOCTYPE html>
<html lang = "en" xmlns:th = "http://www.thymeleaf.org" th:replace = "norml/base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
	<div class = "card mr-3 ml-3">
		<div class = "card-body">
			<div class = "container text-center">
				<img style = "height:200px; width : 200px;" class = "my-profile-picture" th:src = "@{'/img/' + ${contact.image}}">
				<h3 class = "mt-3">
				<span th:text = "${contact.name}"></span>
				( <span th:text = "${contact.nickname}"></span> )
				
				</h3>
			
			
			<table class="table">
  <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col"><span th:text = "${contact.cid}"></span></th>
     </tr>
  </thead>
  <tbody>
    
    <tr>
      <th scope="row">Email</th>
      <td><span th:text = "${contact.email}"></span></td>
      </tr>
      
      <tr>
      <th scope="row">Phone No</th>
      <td><span th:text = "${contact.phoneno}"></span></td>
      </tr>
    
    <tr>
      <th scope="row">Work</th>
      <td><span th:text = "${contact.work}"></span></td>
      </tr>
      
      
  </tbody>
  </table>

<div class = "description mt-3">
  <th:block th:text = "${contact.description}"></th:block>
  </div>
  
  <div class = "container mt-3">
  	<button class = "btn btn-danger btn-sm">Delete</button>
  	<button class = "btn btn-primary btn-sm">Update</button>
  
  </div>
			</div>
		
		
		</div>
	
	
	</div>
		
		
	</section>
</body>
</html>
