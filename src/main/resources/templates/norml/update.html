<!DOCTYPE html>
<html lang = "en" xmlns:th = "http://www.thymeleaf.org" th:replace = "~{norml/base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class = "card mr-3">
		<div class = "card-body">
			<h1 class = "text-center">Update contact</h1>
			<div class = "container-fluid mt-1">
				<div class = "row">
					<div class = "col-md-10 offset-md-1">
					
					
					<form action = "#" 
					th:action = "@{'/user/process-update/' + ${contact.cid}}" 
					th:object = "${contact}"  
					method = "post" 
					class= "mt-2">
					
					<!-- first name field -->
					<div class = "input-group mt-3">
					<div class = "input-group-prepend">
						<div class = "input-group-text ">
							<i class = "fa fa-plus"></i>
							</div>
					
					</div>
							<input required type = "text" th:field = "*{name}" name = "name" placeholder = "Enter name here" class = "form-control py-2 ">

						
						
					
					</div>
					
					<!-- second name field -->
					<div class = "input-group mt-3">
					<div class = "input-group-prepend">
						<div class = "input-group-text ">
							<i class = "fas fa-user-alt"></i>
								</div>
					
					</div>
							<input required type = "text" th:field = "*{nickname}"name = "nickname" placeholder = "Enter nickname here" class = "form-control py-2">
	
						
					
					
					</div>
					
					<!-- phone field -->
					
					<div class = "input-group mt-3">
					<div class = "input-group-prepend">
						<div class = "input-group-text ">
							<i class = "fa fa-phone"></i>
								</div>
					
					</div>
							<input required  type = "number" th:field = "*{phoneno}"name = "phoneno" placeholder = "Enter phone no. here" class = "form-control py-2">
	
						
					
					
					</div>
					
					<!-- email field -->
					<div class = "input-group mt-3">
					<div class = "input-group-prepend">
						<div class = "input-group-text ">
							@
								</div>
					
					</div>
							<input required type = "email" th:field = "*{email}"name = "email" placeholder = "Enter email here" class = "form-control py-2">
	
						
					
					
					</div>
					
					<!-- work field -->
					<div class = "input-group mt-3">
					<div class = "input-group-prepend">
						<div class = "input-group-text ">
							<i class = "fa fa-briefcase"></i>
							</div>
					
					</div>
							<input required type = "text" th:field = "*{work}" name = "work" placeholder = "Enter work here" class = "form-control py-2">
	
						</div>
						
						<!-- description -->
						<div class = "form-group mt-3">
							<textarea id = "mytextarea" th:field = "*{description}" placeholder = "Enter contact description"name = "description" class = "form-control desc-box" row = "10"></textarea>
						
						</div>
						
						<!-- contact image -->
						<div class = "custom-file">
							<input type = "file" name = "profileImage">
						
						</div>
						
						<!-- add contact button -->
						<div class = "container text-center">
						<button type = "submit" class = "btn btn-outline-primary">Update Contact</button>
						
						</div>
					</form>
					
					</div>
				
				
				
				</div>
			
			</div>
		
		</div>
	
	</div>
	
	</section>
</body>
</html>
