<!DOCTYPE html>
<html lang = "en" xmlns:th = "www.thymeleaf.org" th:replace = "norml/base::layout(~{::section})">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	
	<section>
		<div class = "container">
			<div class = "card">
				<div class = "card-body">
				<div class = "container text-center">
					<img style = "height:200px; width : 200px;" class = "my-profile-picture" th:src = "@{'/img/' + ${User.imageUrl}}">
				
				</div>
				<h1 class = "text-center mt-3" th:text = "${User.name}"></h1>
					
					<table class="table text-center">
  <thead>
    <tr>
      <th scope="col">UserId</th>
      <th scope="col"><span th:text = "${User.id}"></span></th>
     </tr>
  </thead>
  <tbody>
    
    <tr>
      <th scope="row">Email</th>
      <td><span th:text = "${User.email}"></span></td>
      </tr>
      
      <tr>
      <th scope="row">Role</th>
      <td><span th:text = "${User.role}"></span></td>
      </tr>
    
    <tr>
      <th scope="row">Enabled</th>
      <td><span th:text = "${User.enabled}"></span></td>
      </tr>
      
      <tr>
      <th scope="row">About</th>
      <td><span th:text = "${User.about}"></span></td>
      </tr>
      
      
  </tbody>
  </table>
				
				
				</div>
			
			</div>
		
		
		</div>
	
	</section>
</body>
</html>
